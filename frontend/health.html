<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101311"><title>ForgeAI · System health</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .health-shell{width:min(760px,calc(100% - 36px));margin:7vh auto}.health-top{display:flex;align-items:center;justify-content:space-between}.health-top a{color:var(--accent)}.health-shell h1{font-size:clamp(34px,7vw,56px);letter-spacing:-.05em}.health-lede{color:var(--muted)}.health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}.health-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:20px}.health-card span{display:block;color:var(--muted);font-size:12px}.health-card strong{display:block;margin-top:9px;font-size:19px}.health-ok{color:var(--accent)}.health-down{color:#f18e82}.health-refresh{margin-top:20px}@media(max-width:520px){.health-grid{grid-template-columns:1fr}.health-shell{margin-top:28px}}
  </style>
</head>
<body><main class="health-shell"><div class="health-top"><a class="brand" href="/"><span class="brand-mark">F</span><span>Forge<span class="brand-ai">AI</span></span></a><a href="/">Back to ForgeAI</a></div><p class="eyebrow">EXHIBITION CHECK</p><h1>System health<span class="heading-period">.</span></h1><p class="health-lede">A quick check of the local demo and selected model provider.</p><div id="health-grid" class="health-grid" aria-live="polite"><article class="health-card"><span>Checking</span><strong>Loading status…</strong></article></div><button id="health-refresh" class="secondary-button health-refresh" type="button">Refresh checks</button></main><script>
async function loadHealth(){const host=document.querySelector('#health-grid');host.textContent='';try{const response=await fetch('/health/data');const data=await response.json();const provider=data.active_provider||'groq';const providerLabel=data.active_provider_label||'Groq API';const cards=[[providerLabel,data.providers?.[provider]?.reachable?'Reachable':'Unavailable'],['Active model',data.active_model||'Groq only'],['Free disk',`${data.free_disk_gb} GB`],['Generated apps',`${data.running_generated_apps} / ${data.app_limit}`],['App lifetime',`${data.app_lifetime_minutes} minutes`]];for(const [label,value] of cards){const card=document.createElement('article');card.className='health-card';const name=document.createElement('span');name.textContent=label;const strong=document.createElement('strong');strong.textContent=value;if(value==='Reachable')strong.className='health-ok';if(value==='Unavailable')strong.className='health-down';card.append(name,strong);host.append(card)}}catch(_error){host.textContent='ForgeAI could not load its health report.'}}document.querySelector('#health-refresh').addEventListener('click',loadHealth);loadHealth();
</script></body></html>
